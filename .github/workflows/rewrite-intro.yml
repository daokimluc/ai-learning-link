          python3 << 'PY'
          import base64, hashlib
          from pathlib import Path
          pairs = [
              ("VOG7lW5nIGjhu6NwIHTDoGkgbGnhu4d1IEFJLi~QaOG6p24gZ2hpIGNow7ogdmnhur90IGLhurFuZy~0aeG6v25nIFZp4buHdC4gVMOgaS~saeG7h3UgdGjDrC~0w6FjaC~oYWkgY2jhu5c6IMSR4buNYy~i4bqxbmcgdGnhur9uZy~WaeG7h3QsIHbDoCDEkeG7jWMgYuG6sW5nIHRp4bq/bmcgQW5oLi~Ucm9uZy~t4buXaS~jaOG7lywgY2hpYS~0aGVvIGjGsOG7m25nLC~raMO0bmcgcGjhuqNpIGzhu5kgdHLDrG5oLi~N4buXaS~t4bulYy~2w6~pIGPDonUgbsOzaS~0w6~pIGxp4buHdSDEkeG7gy~sw6~tIGfDrC4gTGluay~u4bqxbS~yacOqbmcgbeG7mXQgZMOybmcsIGLhuqVtIGhv4bq3Yy~jb3~5IMSRxrDhu6NjLgoKS2jDtG5nIGPhuqduIHhlbS~o4bq/dC4gTeG7nyDEkcO6bmcgaMaw4bubbmcgxJFhbmcgY+G6p24u", "xJDDonkgbMOgIGNo4buXIG3DrG5oIGdvbS~saW5rIGjhu41jIEFJLi~DaOG7ry~naeG6o2kgdGjDrWNoIGzDoC~0aeG6v25nIFZp4buHdC4gTGluay~0aMOsIGNoaWEgaGFpIGLDqm46IG3hu5l0IGLDqm4gxJHhu41jIGLhurFuZy~0aeG6v25nIFZp4buHdCwgbeG7mXQgYsOqbi~0aeG6v25nIEFuaC4KCktow7RuZy~j4bqnbiDEkWkgdOG7qy~0csOqbi~4deG7kW5nLi~IxrDhu5tuZy~uw6~vIMSRYW5nIGPhuqduIHRow6wgbeG7ny~oxrDhu5tuZyDEkcOzLi~MaW5rIMSR4buDIHJpw6puZy~t4buZdC~kw7JuZywgY2hvIGThu4UgYuG6pW0gaG/hurdjIGNvcHku"),
