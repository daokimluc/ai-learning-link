name: assemble-readme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble README and remove source parts
        run: |
          python3 << 'PY'
          from pathlib import Path
          parts = sorted(Path(".build").glob("part-*.txt"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 parts, got {len(parts)}")
          out = b""
          for p in parts:
              raw = p.read_bytes()
              idx = raw.rfind(b"@@END@@")
              if idx < 0:
                  raise SystemExit(f"missing marker in {p}")
              out += raw[:idx]
          Path("README.md").write_bytes(out)
          print("wrote", len(out), "bytes")
          PY
          rm -rf .build .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish the guide under a clearer name"
          git push
