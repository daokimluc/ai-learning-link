name: rename-repo
on:
  workflow_dispatch:
permissions:
  contents: write
  administration: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retitle and rename
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          old = "# What to learn in AI\n"
          new = "# AI learning links\n"
          if text.count(old) != 1:
              raise SystemExit("heading count " + str(text.count(old)))
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm -r .github
          git commit -m "Rename the title to AI learning links"
          git push
          code=$(curl -sS -o /tmp/rename.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY} \
            -d '{"name":"ai-learning-links","description":"AI learning links, grouped by topic."}')
          echo "http ${code}"
          python3 -c 'import json; d=json.load(open("/tmp/rename.json")); print(d.get("full_name"), d.get("message"))'
          test "$code" = "200"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
